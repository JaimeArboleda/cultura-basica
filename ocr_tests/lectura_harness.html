<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>Harness de lectura OCR (depurar_demografia.mjs)</title></head>
  <body>
  <script type="module">
    // Cargado por Playwright (ver ./depurar_demografia.mjs) para ejecutar el
    // MISMO recorte que usa el pipeline real (comun.js::leerPagina) sobre las
    // fotos de prueba ya existentes en este directorio (ocr_tests/v{1,2}/
    // <instancia>/pagina-NN.jpg), pero SOLO hasta el recorte — sin llamar a
    // ocrLinea/Tesseract aquí (evita depender de que Chromium tenga red en
    // este entorno; el reconocimiento se hace después, en Node, con
    // tesseract.js directamente sobre los PNG que devuelve esta función).
    import { construirHoja as construirHojaV1 } from "../public/admin/papel/v1/hoja.js";
    import { construirHoja as construirHojaV2 } from "../public/admin/papel/v2/hoja.js";
    import {
      detectarFiduciales,
      medirGeometriaBaseEnBlanco,
      warpearImagen,
      recortarLinea,
      ESCALA_DIGITALIZACION,
      PAGE_W,
      PAGE_H,
    } from "../public/admin/papel/comun.js";

    const CONSTRUCTORES = { 1: construirHojaV1, 2: construirHojaV2 };

    async function cargarCanvas(url) {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`No se pudo cargar ${url}: HTTP ${resp.status}`);
      const blob = await resp.blob();
      const bitmap = await createImageBitmap(blob);
      const MAX_DIM = 2200; // misma escala que comun.js::prepararImagenFuente
      const factor = Math.min(1, MAX_DIM / Math.max(bitmap.width, bitmap.height));
      const w = Math.round(bitmap.width * factor);
      const h = Math.round(bitmap.height * factor);
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      canvas.getContext("2d").drawImage(bitmap, 0, 0, w, h);
      return canvas;
    }

    // Devuelve { [clave]: dataUrlPng } con el recorte EXACTO (comun.js::recortarLinea)
    // de cada línea `demografia:*` presente en las páginas de datos de esa
    // instancia — mismas páginas y mismo orden que usaría subirLote.js/digitalizar.js
    // al procesar esas fotos de verdad.
    window.recortarDemografia = async (version, persona) => {
      const items = await (await fetch("../data/items.json")).json();
      const layout = await CONSTRUCTORES[version](items);
      // Solo las páginas iniciales que de verdad traen líneas `demografia:*`
      // (construirHoja siempre antepone las páginas de datos a las de ítems,
      // ver comun.js::construirPaginas) — así no hace falta pasar a mano
      // cuántas páginas de datos tiene cada versión, y no se cargan de más
      // las páginas de ítems (que no nos interesan aquí).
      let numPaginasDatos = 0;
      for (const p of layout) {
        if (!p.lineas.some((l) => l.clave.startsWith("demografia:"))) break;
        numPaginasDatos++;
      }
      const geometriaBase = medirGeometriaBaseEnBlanco();
      const destW = Math.round(PAGE_W * ESCALA_DIGITALIZACION);
      const destH = Math.round(PAGE_H * ESCALA_DIGITALIZACION);
      const dst = ["tl", "tr", "br", "bl"].map((e) => ({
        x: geometriaBase.fiduciales[e].cx * ESCALA_DIGITALIZACION,
        y: geometriaBase.fiduciales[e].cy * ESCALA_DIGITALIZACION,
      }));

      const recortes = {};
      for (let n = 1; n <= numPaginasDatos; n++) {
        const nombre = `pagina-${String(n).padStart(2, "0")}.jpg`;
        const canvas = await cargarCanvas(`./v${version}/${persona}/${nombre}`);
        const esquinas = detectarFiduciales(canvas);
        if (!esquinas) {
          recortes[`__error_${nombre}`] = "esquinas no detectadas";
          continue;
        }
        const warp = warpearImagen(canvas, esquinas, destW, destH, dst);
        const paginaLayout = layout[n - 1];
        for (const l of paginaLayout.lineas) {
          if (!l.clave.startsWith("demografia:")) continue;
          const c = recortarLinea(warp, l, ESCALA_DIGITALIZACION);
          recortes[l.clave] = c.toDataURL("image/png");
        }
      }
      return recortes;
    };

    window.__harnessListo = true;
  </script>
  </body>
</html>
