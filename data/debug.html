<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cultura Básica — Debug de ítems</title>
<style>
:root {
  --bg: #f6f5f2;
  --panel: #ffffff;
  --ink: #1c1b1a;
  --muted: #6b6560;
  --border: #e2ddd5;
  --accent: #7a4f2b;
  --ok: #2e7d32;
  --ok-bg: #eaf5ea;
  --parcial: #b8860b;
  --parcial-bg: #fbf3df;
  --fail: #b3261e;
  --fail-bg: #fcebea;
  --pending: #6b6560;
  --pending-bg: #eeece8;
  --chip-bg: #efe9df;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17161a;
    --panel: #232228;
    --ink: #ece9e4;
    --muted: #a39d95;
    --border: #38363c;
    --accent: #d8a978;
    --ok: #7fd88f;
    --ok-bg: #16301c;
    --parcial: #e3c05b;
    --parcial-bg: #362c11;
    --fail: #f0918c;
    --fail-bg: #3a1613;
    --pending: #a39d95;
    --pending-bg: #2b2a2f;
    --chip-bg: #322f34;
  }
}
:root[data-theme="dark"] {
  --bg: #17161a; --panel: #232228; --ink: #ece9e4; --muted: #a39d95;
  --border: #38363c; --accent: #d8a978; --ok: #7fd88f; --ok-bg: #16301c;
  --parcial: #e3c05b; --parcial-bg: #362c11; --fail: #f0918c; --fail-bg: #3a1613;
  --pending: #a39d95; --pending-bg: #2b2a2f; --chip-bg: #322f34;
}
:root[data-theme="light"] {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1c1b1a; --muted: #6b6560;
  --border: #e2ddd5; --accent: #7a4f2b; --ok: #2e7d32; --ok-bg: #eaf5ea;
  --parcial: #b8860b; --parcial-bg: #fbf3df; --fail: #b3261e; --fail-bg: #fcebea;
  --pending: #6b6560; --pending-bg: #eeece8; --chip-bg: #efe9df;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.45;
}
header.top {
  position: sticky; top: 0; z-index: 10;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
}
header.top h1 { font-size: 15px; margin: 0; white-space: nowrap; }
header.top .resumen { color: var(--muted); font-size: 13px; }
header.top .acciones { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
button {
  font: inherit; cursor: pointer; border: 1px solid var(--border);
  background: var(--panel); color: var(--ink); border-radius: 8px;
  padding: 7px 12px;
}
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button:hover { filter: brightness(0.97); }
main { max-width: 900px; margin: 0 auto; padding: 16px; }
nav.toc { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 20px; position: sticky; top: 53px; z-index: 9; background: var(--bg); padding-top: 4px; padding-bottom: 4px; }
nav.toc button {
  font-size: 12.5px; color: var(--ink);
  background: var(--chip-bg); border: 1px solid transparent; border-radius: 999px; padding: 5px 12px;
}
nav.toc button.activa { background: var(--accent); color: #fff; }
section.bloque {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  margin-bottom: 22px; overflow: hidden;
}
section.bloque.oculto { display: none !important; }
.bloque-header { padding: 14px 18px; border-bottom: 1px solid var(--border); }
.bloque-header h2 { margin: 0 0 6px; font-size: 17px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 8px; font-size: 12px; color: var(--muted); }
.stats .chip { background: var(--chip-bg); border-radius: 999px; padding: 2px 9px; }
.items { padding: 10px 18px 18px; }
.item {
  border-top: 1px dashed var(--border);
  padding: 16px 0;
}
.item:first-child { border-top: none; }
.item-debug {
  display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px;
}
.badge {
  font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border);
  color: var(--muted); background: var(--chip-bg); font-family: ui-monospace, Menlo, Consolas, monospace;
}
.badge.dif-facil { color: var(--ok); }
.badge.dif-medio { color: var(--parcial); }
.badge.dif-dificil { color: var(--fail); }
.badge.ancla { color: var(--accent); border-color: var(--accent); }
.enunciado { font-size: 15.5px; margin: 0 0 10px; font-weight: 600; }
.texto-lectura { font-size: 14px; white-space: pre-line; background: var(--chip-bg); color: var(--ink); padding: 10px 12px; border-radius: 6px; margin: 0 0 10px; border: 1px solid var(--border); }
.opciones { display: flex; flex-direction: column; gap: 6px; }
.opciones label {
  display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px;
  border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 14px;
}
.opciones label:hover { background: var(--chip-bg); }
input[type="text"] {
  width: 100%; max-width: 360px; font: inherit; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--ink);
}
ul.ordenar { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-width: 420px; }
ul.ordenar li {
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px;
  background: var(--bg); font-size: 14px; cursor: grab;
}
ul.ordenar li.dragging { opacity: 0.4; }
ul.ordenar li .handle { color: var(--muted); font-size: 12px; }
ul.ordenar li .mover { margin-left: auto; display: flex; gap: 4px; }
ul.ordenar li .mover button { padding: 2px 7px; font-size: 12px; }
.clasificar { display: flex; flex-direction: column; gap: 12px; }
.clasificar .bandeja {
  list-style: none; margin: 0; padding: 8px; display: flex; flex-wrap: wrap; gap: 8px;
  border: 1px dashed var(--border); border-radius: 8px; min-height: 44px;
}
.clasificar .bandeja.pool { background: var(--chip-bg); }
.clasificar .cajas { display: flex; flex-wrap: wrap; gap: 10px; }
.clasificar .caja { flex: 1 1 200px; min-width: 180px; }
.clasificar .caja h4 { margin: 0 0 6px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.clasificar .ficha {
  border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px;
  background: var(--panel); font-size: 13.5px; cursor: grab; user-select: none;
}
.clasificar .ficha.dragging { opacity: 0.4; }
.clasificar .bandeja.dragover { border-color: var(--accent); }
.resultado {
  margin-top: 10px; font-size: 13px; border-radius: 8px; padding: 8px 10px; display: none;
}
.resultado.show { display: block; }
.resultado.ok { background: var(--ok-bg); color: var(--ok); }
.resultado.parcial { background: var(--parcial-bg); color: var(--parcial); }
.resultado.fail { background: var(--fail-bg); color: var(--fail); }
.resultado.pending { background: var(--pending-bg); color: var(--pending); }
.resultado dl { margin: 4px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; }
.resultado dt { opacity: 0.75; }
.resultado dt::after { content: ":"; }
footer.bar {
  position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--border);
  padding: 10px 16px; display: flex; justify-content: center; gap: 10px;
}
.oculto { display: none !important; }
</style>
</head>
<body>
<header class="top">
  <h1>Cultura Básica · Debug</h1>
  <span class="resumen" id="resumen-global"></span>
  <div class="acciones">
    <button id="btn-limpiar">Limpiar respuestas</button>
    <button id="btn-corregir" class="primary">Comprobar todo</button>
  </div>
</header>
<main>
  <nav class="toc" id="toc"></nav>
  <div id="bloques"></div>
</main>
<footer class="bar">
  <button id="btn-corregir-2" class="primary">Comprobar todo</button>
</footer>

],"indice_correcto":0},{"id":"RAZ-06","bloque":"razonamiento","dificultad":"medio","ancla":false,"formato":"opcion_multiple","enunciado":"Después de tomar una vitamina, Juan se curó de un resfriado. Juan concluye que la vitamina lo curó. ¿Qué falacia comete?","texto":null,"elementos":null,"elementos_ordenados":null,"categorias":null,"clasificacion_correcta":null,"respuesta_canonica":null,"alias":null,"alias_parcial":null,"tolerancia_edicion":null,"opciones":["Post hoc ergo propter hoc: confundir que un hecho suceda después de otro con que lo haya causado","Ad hominem: atacar a la persona en vez de al argumento","Falacia del hombre de paja: rebatir una versión distorsionada del argumento contrario","Falso dilema: reducir las opciones a solo dos cuando hay más","Apelación a la autoridad: dar por cierto algo solo porque lo dice alguien con prestigio","Petición de principio: dar por cierta la conclusión dentro de una de las premisas"],"indice_correcto":0},{"id":"RAZ-07","bloque":"razonamiento","dificultad":"medio","ancla":false,"formato":"ordenar","enunciado":"Ordena estos pasos del método científico, del primero al último:","texto":null,"elementos":["Formular una hipótesis","Analizar los resultados y sacar una conclusión","Observar un fenómeno","Diseñar un experimento para comprobar la hipótesis"],"elementos_ordenados":["Observar un fenómeno","Formular una hipótesis","Diseñar un experimento para comprobar la hipótesis","Analizar los resultados y sacar una conclusión"],"categorias":null,"clasificacion_correcta":null,"respuesta_canonica":null,"alias":null,"alias_parcial":null,"tolerancia_edicion":null,"opciones":null,"indice_correcto":null},{"id":"RAZ-08","bloque":"razonamiento","dificultad":"medio","ancla":false,"formato":"clasificar","enunciado":"Clasifica cada frase según el tipo de falacia que comete:","texto":null,"elementos":["\"No hagas caso a su argumento sobre economía, si ni siquiera terminó la carrera\"","\"O apoyas esta ley o es que no te importa la seguridad de nadie\"","\"Conocí a dos taxistas maleducados, así que todos los taxistas son maleducados\"","\"Debe de ser verdad, lo dijo un actor famoso en la televisión\""],"elementos_ordenados":null,"categorias":["Ad hominem","Falso dilema","Generalización apresurada","Apelación a la autoridad"],"clasificacion_correcta":{"\"No hagas caso a su argumento sobre economía, si ni siquiera terminó la carrera\"":"Ad hominem","\"O apoyas esta ley o es que no te importa la seguridad de nadie\"":"Falso dilema","\"Conocí a dos taxistas maleducados, así que todos los taxistas son maleducados\"":"Generalización apresurada","\"Debe de ser verdad, lo dijo un actor famoso en la televisión\"":"Apelación a la autoridad"},"respuesta_canonica":null,"alias":null,"alias_parcial":null,"tolerancia_edicion":null,"opciones":null,"indice_correcto":null},{"id":"RAZ-09","bloque":"razonamiento","dificultad":"dificil","ancla":false,"formato":"opcion_multiple","enunciado":"Se afirma la regla: \"Si una tarjeta tiene una vocal en una cara, tiene un número par en la otra\". Tienes 4 tarjetas sobre la mesa mostrando, respectivamente: A, B, 4 y 7. ¿Qué tarjetas hay que girar como mínimo para comprobar si la regla se cumple?","texto":null,"elementos":null,"elementos_ordenados":null,"categorias":null,"clasificacion_correcta":null,"respuesta_canonica":null,"alias":null,"alias_parcial":null,"tolerancia_edicion":null,"opciones":["La A y la 7","La A y la 4","Solo la A","La A, la 4 y la 7","La B y la 4","Las cuatro tarjetas"],"indice_correcto":0},{"id":"RAZ-10","bloque":"razonamiento","dificultad":"dificil","ancla":false,"formato":"opcion_multiple","enunciado":"En una isla, los \"caballeros\" siempre dicen la verdad y los \"embusteros\" siempre mienten. Un habitante de la isla afirma: \"Soy un embustero\". ¿Qué se puede concluir?","texto":null,"elementos":null,"elementos_ordenados":null,"categorias":null,"clasificacion_correcta":null,"respuesta_canonica":null,"alias":null,"alias_parcial":null,"tolerancia_edicion":null,"opciones":["Ningún habitante de la isla podría decir esa frase: un caballero mentiría al decirla y un embustero diría la verdad al decirla","Es un embustero","Es un caballero","Puede ser cualquiera de los dos con la misma probabilidad","Es un caballero que se ha equivocado al hablar","Depende de en qué día de la semana lo diga"],"indice_correcto":0},{"id":"RAZ-11","bloque":"razonamiento","dificultad":"dificil","ancla":false,"formato":"abierto","enunciado":"Un padre tiene 4 veces la edad de su hijo. Dentro de 20 años, el padre tendrá el doble de la edad de su hijo. ¿Qué edad tiene el hijo ahora?","texto":null,"elementos":null,"elementos_ordenados":null,"categorias":null,"clasificacion_correcta":null,"respuesta_canonica":"10 años","alias":["10","diez","10 años","diez años"],"alias_parcial":null,"tolerancia_edicion":0,"opciones":null,"indice_correcto":null},{"id":"RAZ-12","bloque":"razonamiento","dificultad":"dificil","ancla":false,"formato":"opcion_multiple","enunciado":"En una bolsa hay 3 bolas rojas y 2 azules. Se sacan dos bolas al azar, sin devolver la primera a la bolsa. ¿Cuál es la probabilidad de que las dos sean rojas?","texto":null,"elementos":null,"elementos_ordenados":null,"categorias":null,"clasificacion_correcta":null,"respuesta_canonica":null,"alias":null,"alias_parcial":null,"tolerancia_edicion":null,"opciones":["3/10 (30%)","3/5 (60%)","1/2 (50%)","9/25 (36%)","2/5 (40%)","3/8 (37,5%)"],"indice_correcto":0}]},{"bloque":"comprension_lectora","nombre":"Comprensión lectora","items":[{"id":"COM-01","bloque":"comprension_lectora","dificultad":"facil","ancla":false,"formato":"abierto","enunciado":"Según el texto, ¿quién de los tres astronautas no llegó a pisar la superficie de la Luna?","texto":"En 1969, la misión Apolo 11 de la NASA logró que el ser humano pisara la Luna por primera vez. El módulo de mando, llamado Columbia, permaneció en órbita lunar mientras el módulo lunar Eagle descendía a la superficie con dos de los tres astronautas a bordo.\n\nNeil Armstrong fue el primero en poner el pie en el suelo lunar, seguido minutos después por Buzz Aldrin. El tercer astronauta, Michael Collins, se quedó pilotando el módulo de mando en órbita y no llegó a caminar sobre la Luna.","elementos":null,"elementos_ordenados":null,"categorias":null,"clasificacion_correcta":null,"respuesta_canonica":"Michael Collins","alias":["michael collins","collins","michael"],"alias_parcial":null,"tolerancia_edicion":1,"opciones":null,"indice_correcto":null},{"id":"COM-02","bloque":"comprension_lectora","dificultad":"facil","ancla":false,"formato":"opcion_multiple","enunciado":"¿Cuál es la idea principal del texto?","texto":"Muchas personas creen que el chocolate negro con alto porcentaje de cacao aporta beneficios para la salud cardiovascular, gracias a unos compuestos llamados flavonoides. Sin embargo, los nutricionistas insisten en que estos beneficios solo aparecen con un consumo moderado: unos pocos gramos al día.\n\nEl problema es que buena parte del chocolate que se vende comercialmente contiene también grandes cantidades de azúcar y grasa, lo que anula cualquier ventaja si se consume en exceso. Por eso, el chocolate con mayor porcentaje de cacao y menos azúcar añadido es preferible al chocolate con leche.","elementos":null,"elementos_ordenados":null,"categorias":null,"clasificacion_correcta":null,"respuesta_canonica":null,"alias":null,"alias_parcial":null,"tolerancia_edicion":null,"opciones":["El chocolate negro puede tener beneficios para la salud, pero solo si se consume con moderación y con poco azúcar añadido","El chocolate es perjudicial para la salud en cualquier cantidad","Todo el chocolate comercial contiene flavonoides beneficiosos","El chocolate con leche es más sano que el chocolate negro","Los nutricionistas recomiendan comer chocolate a diario sin límite","Los flavonoides solo se encuentran en el chocolate con leche"],"indice_correcto":0},{"id":"COM-03","bloque":"comprension_lectora","dificultad":"facil","ancla":false,"formato":"opcion_multiple","enunciado":"Según el texto, ¿qué le ocurre al coral durante el blanqueamiento?","texto":"La Gran Barrera de Coral, situada frente a la costa noreste de Australia, es el mayor sistema de arrecifes de coral del mundo. Se extiende a lo largo de más de 2.300 kilómetros y puede verse incluso desde el espacio.\n\nEn las últimas décadas, el aumento de la temperatura del mar ha provocado episodios repetidos de blanqueamiento del coral, un proceso en el que los corales expulsan las algas que les dan color y alimento, y que puede acabar matándolos si se prolonga demasiado tiempo.","elementos":null,"elementos_ordenados":null,"categorias":null,"clasificacion_correcta":null,"respuesta_canonica":null,"alias":null,"alias_parcial":null,"tolerancia_edicion":null,"opciones":["Expulsa las algas que le dan color y alimento","Absorbe más algas de las que necesita","Se vuelve más resistente al calor","Se traslada a aguas más frías","Aumenta su producción de oxígeno","Se reproduce con mayor rapidez"],"indice_correcto":0},{"id":"COM-04","bloque":"comprension_lectora","dificultad":"facil","ancla":false,"formato":"abierto","enunciado":"Según el texto, ¿en qué dos categorías obtuvo Marie Curie el Premio Nobel?","texto":"Marie Curie fue una científica de origen polaco que dedicó su vida al estudio de la radiactividad, término que ella misma acuñó. Trabajó junto a su marido, Pierre Curie, con quien descubrió dos nuevos elementos químicos: el polonio y el radio.\n\nEn 1903 recibió el Premio Nobel de Física, compartido con Pierre Curie y Henri Becquerel. Años más tarde, en 1911, volvió a ganar el Nobel, esta vez en Química, convirtiéndose en la primera persona en obtener dos premios Nobel en categorías científicas distintas.","elementos":null,"elementos_ordenados":null,"categorias":null,"clasificacion_correcta":null,"respuesta_canonica":"Física y Química","alias":["fisica y quimica","física y química","quimica y fisica","química y física"],"alias_parcial":null,"tolerancia_edicion":2,"opciones":null,"indice_correcto":null},{"id":"COM-05","bloque":"comprension_lectora","dificultad":"medio","ancla":true,"formato":"opcion_multiple","enunciado":"¿Qué se puede inferir de la situación descrita en el texto?","texto":"Cuando Elena llegó a la reunión, todos guardaron silencio de golpe y varios apartaron la vista de la pantalla del ordenador. Sobre la mesa había un pastel con velas ya colocadas, aunque nadie las había encendido todavía. Marcos se apresuró a cerrar de un manotazo la ventana del navegador.\n\nElena sonrió, dejó su bolso en la silla y dijo: \"Voy a por un café, ahora vuelvo\", y salió de la sala tan tranquila.","elementos":null,"elementos_ordenados":null,"categorias":null,"clasificacion_correcta":null,"respuesta_canonica":null,"alias":null,"alias_parcial":null,"tolerancia_edicion":null,"opciones":["Los compañeros de Elena le estaban preparando una fiesta sorpresa","Elena acababa de ser despedida","Marcos estaba enfadado con Elena","La reunión había terminado antes de que llegara Elena","Elena llegaba tarde y sus compañeros estaban molestos","El ordenador de Marcos se había averiado"],"indice_correcto":0},{"id":"COM-06","bloque":"comprension_lectora","dificultad":"medio","ancla":false,"formato":"opcion_multiple","enunciado":"En el contexto del texto, ¿qué significa que la decisión fue calificada de \"flagrante contradicción\"?","texto":"El nuevo alcalde prometió durante la campaña una gestión austera de las cuentas municipales, pero apenas seis meses después de tomar posesión encargó la construcción de una rotonda monumental que costó más de dos millones de euros. Varios concejales de la oposición calificaron la decisión de flagrante contradicción con lo prometido.\n\nEl propio alcalde, sin embargo, defendió la obra como una inversión necesaria para la imagen de la ciudad.","elementos":null,"elementos_ordenados":null,"categorias":null,"clasificacion_correcta":null,"respuesta_canonica":null,"alias":null,"alias_parcial":null,"tolerancia_edicion":null,"opciones":["Que resultaba evidente y notorio que la obra iba en contra de lo prometido en campaña","Que la obra fue aprobada sin ningún debate en el ayuntamiento","Que el coste de la rotonda fue mayor de lo previsto inicialmente","Que la oposición apoyó la construcción de la rotonda","Que el alcalde negó haber prometido austeridad en algún momento","Que la rotonda se construyó en un lugar distinto al anunciado"],"indice_correcto":0},{"id":"COM-07","bloque":"comprension_lectora","dificultad":"medio","ancla":false,"formato":"ordenar","enunciado":"Ordena estos sucesos del texto según el orden en que ocurrieron:","texto":"Aquella mañana, Sara se despertó tarde porque se le había estropeado el despertador. Salió corriendo de casa sin desayunar y llegó a la estación justo quince segundos después de que el tren cerrara las puertas. Como no quería llegar tarde al trabajo, decidió coger un taxi, pero se topó con un atasco enorme en la avenida principal. Finalmente, entró en la oficina con media hora de retraso y se disculpó con su jefe.","elementos":["Se quedó atrapada en un atasco","Perdió el tren por quince segundos","Se disculpó con su jefe","Se despertó tarde"],"elementos_ordenados":["Se despertó tarde","Perdió el tren por quince segundos","Se quedó atrapada en un atasco","Se disculpó con su jefe"],"categorias":null,"clasificacion_correcta":null,"respuesta_canonica":null,"alias":null,"alias_parcial":null,"tolerancia_edicion":null,"opciones":null,"indice_correcto":null},{"id":"COM-08","bloque":"comprension_lectora","dificultad":"medio","ancla":false,"formato":"opcion_multiple","enunciado":"¿Cuál es la idea principal del texto?","texto":"Durante décadas se pensó que la memoria funcionaba como una grabadora que almacenaba los recuerdos de forma fija e inalterable, lista para reproducirse tal cual cuando se necesitara. Las investigaciones en neurociencia de las últimas décadas han cuestionado seriamente esta idea.\n\nCada vez que recuperamos un recuerdo, el cerebro vuelve a reconstruirlo, y en ese proceso puede introducir pequeños cambios, mezclar detalles de otros recuerdos o incorporar información recibida después del suceso original. Esto explica por qué dos testigos de un mismo hecho pueden recordarlo de forma distinta con el paso del tiempo, sin que ninguno de los dos esté necesariamente mintiendo.","elementos":null,"elementos_ordenados":null,"categorias":null,"clasificacion_correcta":null,"respuesta_canonica":null,"alias":null,"alias_parcial":null,"tolerancia_edicion":null,"opciones":["La memoria no es una grabación fija, sino que se reconstruye cada vez que se recuerda algo, lo que puede introducir cambios","Los testigos de un hecho siempre mienten al recordarlo","La neurociencia ha demostrado que los recuerdos nunca cambian","La memoria humana funciona exactamente igual que una grabadora","Solo algunas personas tienen una memoria que se reconstruye con el tiempo","Los recuerdos recientes son siempre más fiables que los antiguos"],"indice_correcto":0},{"id":"COM-09","bloque":"comprension_lectora","dificultad":"dificil","ancla":false,"formato":"opcion_multiple","enunciado":"¿Cuál es la actitud del autor del texto hacia el proyecto del centro comercial?","texto":"Es maravilloso comprobar, una vez más, que basta con talar unas cuantas hectáreas de bosque centenario para construir un espléndido centro comercial con aparcamiento para dos mil vehículos. Sin duda, las generaciones futuras nos lo agradecerán profundamente cuando disfruten de sus rebajas de temporada bajo un cielo cada vez más gris.\n\nLas autoridades locales, por su parte, han calificado el proyecto de \"apuesta decidida por el progreso y el empleo\", sin mencionar en ningún momento el informe de impacto ambiental que ellas mismas encargaron y que recomendaba justo lo contrario.","elementos":null,"elementos_ordenados":null,"categorias":null,"clasificacion_correcta":null,"respuesta_canonica":null,"alias":null,"alias_parcial":null,"tolerancia_edici <script>
// --- Normalización y distancia de Levenshtein, igual que README §1.6 ---
function normalizar(s) {
  return String(s ?? "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^\p{L}\p{N}\s]/gu, "")
    .replace(/\s+/g, " ")
    .trim();
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  let prev = new Array(n + 1);
  let curr = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    curr[0] = i;
    for (let j = 1; j <= n; j++) {
      const coste = a[i - 1] === b[j - 1] ? 0 : 1;
      curr[j] = Math.min(
        prev[j] + 1,
        curr[j - 1] + 1,
        prev[j - 1] + coste
      );
    }
    [prev, curr] = [curr, prev];
  }
  return prev[n];
}

function distanciaMinima(respuestaNorm, lista) {
  let mejor = null;
  for (const alias of lista ?? []) {
    const aliasNorm = normalizar(alias);
    const d = levenshtein(respuestaNorm, aliasNorm);
    if (mejor === null || d < mejor.distancia) mejor = { alias, aliasNorm, distancia: d };
  }
  return mejor;
}

// Corrige un ítem 'abierto' según el algoritmo del README §1.6.
function corregirAbierto(item, respuestaCruda) {
  const respuestaNorm = normalizar(respuestaCruda);
  if (respuestaNorm === "") {
    return { estado: "pending", acierto: null, detalle: { motivo: "sin respuesta" } };
  }
  // Sin tolerancia para respuestas de ≤4 caracteres (deben coincidir exactas).
  const tolerancia = respuestaNorm.length <= 4 ? 0 : (item.tolerancia_edicion ?? 0);

  const match = distanciaMinima(respuestaNorm, item.alias);
  if (match && match.distancia <= tolerancia) {
    return {
      estado: "ok", acierto: 1,
      detalle: {
        estado_correccion: "auto",
        alias_match: match.alias,
        distancia: match.distancia,
        tolerancia_aplicada: tolerancia,
      },
    };
  }
  const matchParcial = distanciaMinima(respuestaNorm, item.alias_parcial);
  if (matchParcial && matchParcial.distancia <= tolerancia) {
    return {
      estado: "parcial", acierto: 0,
      detalle: {
        estado_correccion: "parcial",
        alias_parcial_match: matchParcial.alias,
        distancia: matchParcial.distancia,
        tolerancia_aplicada: tolerancia,
      },
    };
  }
  return {
    estado: "fail", acierto: 0,
    detalle: {
      estado_correccion: "auto",
      alias_mas_cercano: match ? match.alias : null,
      distancia_minima: match ? match.distancia : null,
      tolerancia_aplicada: tolerancia,
    },
  };
}

function corregirOpcionMultiple(item, indiceElegido) {
  if (indiceElegido === null || indiceElegido === undefined) {
    return { estado: "pending", acierto: null, detalle: { motivo: "sin respuesta" } };
  }
  const acierto = Number(indiceElegido) === item.indice_correcto ? 1 : 0;
  return {
    estado: acierto ? "ok" : "fail",
    acierto,
    detalle: {
      estado_correccion: "auto",
      opcion_elegida: item.opciones[indiceElegido],
      opcion_correcta: item.opciones[item.indice_correcto],
    },
  };
}

function corregirOrdenar(item, ordenActual) {
  if (!ordenActual) return { estado: "pending", acierto: null, detalle: { motivo: "sin respuesta" } };
  const acierto = JSON.stringify(ordenActual) === JSON.stringify(item.elementos_ordenados) ? 1 : 0;
  return {
    estado: acierto ? "ok" : "fail",
    acierto,
    detalle: {
      estado_correccion: "auto",
      orden_enviado: ordenActual.join(" → "),
      orden_correcto: item.elementos_ordenados.join(" → "),
    },
  };
}

function corregirClasificar(item, asignacionActual) {
  if (!asignacionActual || Object.keys(asignacionActual).length !== item.elementos.length) {
    return { estado: "pending", acierto: null, detalle: { motivo: "sin responder / incompleto" } };
  }
  const acierto = item.elementos.every(
    (el) => asignacionActual[el] === item.clasificacion_correcta[el]
  )
    ? 1
    : 0;
  return {
    estado: acierto ? "ok" : "fail",
    acierto,
    detalle: {
      estado_correccion: "auto",
      asignacion_enviada: item.elementos.map((el) => `${el} → ${asignacionActual[el]}`).join(", "),
      asignacion_correcta: item.elementos.map((el) => `${el} → ${item.clasificacion_correcta[el]}`).join(", "),
    },
  };
}

// --- Render ---
const $bloques = document.getElementById("bloques");
const $toc = document.getElementById("toc");
const $resumen = document.getElementById("resumen-global");

function contar(items, campo) {
  const c = {};
  for (const it of items) c[it[campo]] = (c[it[campo]] ?? 0) + 1;
  return c;
}

function chipsCuenta(c, prefijo) {
  return Object.entries(c)
    .map(([k, v]) => `<span class="chip">${prefijo ? prefijo + " " : ""}${k}: ${v}</span>`)
    .join("");
}

let totalItems = 0;
for (const b of BLOQUES) totalItems += b.items.length;
$resumen.textContent = `${BLOQUES.length} bloques · ${totalItems} ítems cargados`;

for (const b of BLOQUES) {
  const tab = document.createElement("button");
  tab.type = "button";
  tab.textContent = `${b.nombre} (${b.items.length})`;
  tab.dataset.bloque = b.bloque;
  tab.addEventListener("click", () => mostrarBloque(b.bloque));
  $toc.appendChild(tab);

  const porDif = contar(b.items, "dificultad");
  const porFormato = contar(b.items, "formato");
  const ancla = b.items.find((i) => i.ancla);

  const section = document.createElement("section");
  section.className = "bloque";
  section.id = `bloque-${b.bloque}`;
  section.innerHTML = `
    <div class="bloque-header">
      <h2>${b.nombre}</h2>
      <div class="stats">
        <span class="chip"><strong>${b.items.length}</strong> ítems</span>
        ${chipsCuenta(porDif)}
        ${chipsCuenta(porFormato)}
        <span class="chip">ancla: ${ancla ? ancla.id : "—"}</span>
      </div>
    </div>
    <div class="items"></div>
  `;
  const $items = section.querySelector(".items");

  for (const item of b.items) {
    $items.appendChild(renderItem(item));
  }
  $bloques.appendChild(section);
}

function mostrarBloque(bloque) {
  document.querySelectorAll("section.bloque").forEach((s) => {
    s.classList.toggle("oculto", s.id !== `bloque-${bloque}`);
  });
  document.querySelectorAll("nav.toc button").forEach((btn) => {
    btn.classList.toggle("activa", btn.dataset.bloque === bloque);
  });
  window.scrollTo({ top: 0 });
}

if (BLOQUES.length > 0) mostrarBloque(BLOQUES[0].bloque);

function renderItem(item) {
  const div = document.createElement("div");
  div.className = "item";
  div.dataset.itemId = item.id;

  const debugBadges = `
    <span class="badge">${item.id}</span>
    <span class="badge dif-${item.dificultad}">${item.dificultad}</span>
    <span class="badge">${item.formato}</span>
    ${item.ancla ? '<span class="badge ancla">⚓ ancla</span>' : ""}
  `;

  let cuerpo = "";
  if (item.formato === "abierto") {
    cuerpo = `<input type="text" data-role="respuesta" placeholder="Escribe la respuesta…" autocomplete="off">`;
  } else if (item.formato === "opcion_multiple") {
    cuerpo = `<div class="opciones">${item.opciones
      .map(
        (op, i) =>
          `<label><input type="radio" name="op-${item.id}" value="${i}"> ${op}</label>`
      )
      .join("")}</div>`;
  } else if (item.formato === "ordenar") {
    cuerpo = `<ul class="ordenar" data-role="ordenar">${item.elementos
      .map((el) => `<li draggable="true"><span class="handle">⠿</span><span class="texto">${el}</span><span class="mover"><button type="button" data-mover="up">↑</button><button type="button" data-mover="down">↓</button></span></li>`)
      .join("")}</ul>`;
  } else if (item.formato === "clasificar") {
    cuerpo = `<div class="clasificar" data-role="clasificar">
      <ul class="bandeja pool" data-caja="__pool__">${item.elementos
        .map((el) => `<li class="ficha" draggable="true" data-elemento="${el}">${el}</li>`)
        .join("")}</ul>
      <div class="cajas">${item.categorias
        .map(
          (cat) =>
            `<div class="caja"><h4>${cat}</h4><ul class="bandeja" data-caja="${cat}"></ul></div>`
        )
        .join("")}</div>
    </div>`;
  }

  div.innerHTML = `
    <div class="item-debug">${debugBadges}</div>
    ${item.texto ? `<p class="texto-lectura">${item.texto}</p>` : ""}
    <p class="enunciado">${item.enunciado}</p>
    ${cuerpo}
    <div class="resultado" data-role="resultado"></div>
  `;

  if (item.formato === "ordenar") {
    activarOrdenar(div.querySelector("ul.ordenar"));
  } else if (item.formato === "clasificar") {
    activarClasificar(div.querySelector('[data-role="clasificar"]'));
  }

  return div;
}

function activarOrdenar(ul) {
  let dragEl = null;
  ul.addEventListener("dragstart", (e) => {
    dragEl = e.target.closest("li");
    dragEl.classList.add("dragging");
  });
  ul.addEventListener("dragend", () => dragEl && dragEl.classList.remove("dragging"));
  ul.addEventListener("dragover", (e) => {
    e.preventDefault();
    const after = [...ul.querySelectorAll("li:not(.dragging)")].find(
      (li) => e.clientY <= li.getBoundingClientRect().top + li.getBoundingClientRect().height / 2
    );
    if (after) ul.insertBefore(dragEl, after);
    else ul.appendChild(dragEl);
  });
  ul.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-mover]");
    if (!btn) return;
    const li = btn.closest("li");
    if (btn.dataset.mover === "up" && li.previousElementSibling) {
      li.parentNode.insertBefore(li, li.previousElementSibling);
    } else if (btn.dataset.mover === "down" && li.nextElementSibling) {
      li.parentNode.insertBefore(li.nextElementSibling, li);
    }
  });
}

function activarClasificar(root) {
  let dragEl = null;
  root.addEventListener("dragstart", (e) => {
    dragEl = e.target.closest(".ficha");
    if (dragEl) dragEl.classList.add("dragging");
  });
  root.addEventListener("dragend", () => {
    if (dragEl) dragEl.classList.remove("dragging");
    root.querySelectorAll(".bandeja.dragover").forEach((b) => b.classList.remove("dragover"));
  });
  root.querySelectorAll("ul.bandeja").forEach((bandeja) => {
    bandeja.addEventListener("dragover", (e) => {
      e.preventDefault();
      bandeja.classList.add("dragover");
    });
    bandeja.addEventListener("dragleave", () => bandeja.classList.remove("dragover"));
    bandeja.addEventListener("drop", (e) => {
      e.preventDefault();
      bandeja.classList.remove("dragover");
      if (dragEl) bandeja.appendChild(dragEl);
    });
  });
}

function leerClasificacion(root) {
  const asignacion = {};
  root.querySelectorAll('ul.bandeja[data-caja]:not([data-caja="__pool__"]) .ficha').forEach((li) => {
    asignacion[li.dataset.elemento] = li.closest("ul.bandeja").dataset.caja;
  });
  return asignacion;
}

function itemPorId(id) {
  for (const b of BLOQUES) {
    const it = b.items.find((i) => i.id === id);
    if (it) return it;
  }
  return null;
}

function corregirTarjeta(div) {
  const item = itemPorId(div.dataset.itemId);
  const $res = div.querySelector('[data-role="resultado"]');
  let resultado;

  if (item.formato === "abierto") {
    const valor = div.querySelector('[data-role="respuesta"]').value;
    resultado = corregirAbierto(item, valor);
  } else if (item.formato === "opcion_multiple") {
    const marcado = div.querySelector(`input[name="op-${item.id}"]:checked`);
    resultado = corregirOpcionMultiple(item, marcado ? marcado.value : null);
  } else if (item.formato === "ordenar") {
    const li = [...div.querySelectorAll('ul.ordenar li .texto')].map((n) => n.textContent);
    const sinTocar = JSON.stringify(li) === JSON.stringify(item.elementos);
    resultado = corregirOrdenar(item, li.length ? li : null);
    if (sinTocar) resultado.detalle.aviso = "orden de presentación sin modificar";
  } else if (item.formato === "clasificar") {
    const asignacion = leerClasificacion(div.querySelector('[data-role="clasificar"]'));
    resultado = corregirClasificar(item, asignacion);
  }

  $res.className = "resultado show " + resultado.estado;
  const etiqueta = { ok: "✔ Acierto", parcial: "◐ Parcial (fallo puntuado, categoría distinta)", fail: "✘ Fallo", pending: "— Sin responder" }[resultado.estado];
  const filas = Object.entries(resultado.detalle)
    .map(([k, v]) => `<dt>${k}</dt><dd>${v ?? "—"}</dd>`)
    .join("");
  $res.innerHTML = `<strong>${etiqueta}</strong><dl>${filas}</dl>`;
}

function bloqueActivo() {
  return document.querySelector("section.bloque:not(.oculto)");
}

function comprobarTodo() {
  const bloque = bloqueActivo();
  if (!bloque) return;
  bloque.querySelectorAll(".item").forEach(corregirTarjeta);
}

function limpiarTodo() {
  const bloque = bloqueActivo();
  if (!bloque) return;
  bloque.querySelectorAll('input[type="text"]').forEach((i) => (i.value = ""));
  bloque.querySelectorAll('input[type="radio"]').forEach((i) => (i.checked = false));
  bloque.querySelectorAll(".resultado").forEach((r) => {
    r.className = "resultado";
    r.innerHTML = "";
  });
  bloque.querySelectorAll("ul.ordenar").forEach((ul) => {
    const item = itemPorId(ul.closest(".item").dataset.itemId);
    const original = [...ul.querySelectorAll("li")];
    const porTexto = new Map(original.map((li) => [li.querySelector(".texto").textContent, li]));
    for (const el of item.elementos) ul.appendChild(porTexto.get(el));
  });
  bloque.querySelectorAll('[data-role="clasificar"]').forEach((root) => {
    const pool = root.querySelector('ul.bandeja[data-caja="__pool__"]');
    root.querySelectorAll(".ficha").forEach((li) => pool.appendChild(li));
  });
}

document.getElementById("btn-corregir").addEventListener("click", comprobarTodo);
document.getElementById("btn-corregir-2").addEventListener("click", comprobarTodo);
document.getElementById("btn-limpiar").addEventListener("click", limpiarTodo);
</script>
