<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Harness de paginación</title>
  </head>
  <body></body>
  <script type="module">
    // Cargado por Playwright (ver ./build-paginacion.mjs) en un Chromium real
    // para calcular, UNA sola vez, cuántos bloques caben en cada página de la
    // hoja v1/v2 — usando los mismos módulos y el mismo empaquetado voraz por
    // altura que ../public/admin/papel/comun.js ya usaba en cada dispositivo,
    // pero aquí solo para producir data/paginacion.json (README, "Paginado
    // fiable"). No hace falta CSS_HOJA/QR aquí: construirHoja ya inyecta su
    // propio <style> con el CSS completo (ver comun.js::construirPaginas) y
    // llamarla sin `qr` construye el layout sin generar ningún código QR real
    // (el mismo modo que usa digitalizar.js para reconstruir el layout al
    // leer, no al imprimir).
    import { construirHoja as construirHojaV1 } from "../public/admin/papel/v1/hoja.js";
    import { construirHoja as construirHojaV2 } from "../public/admin/papel/v2/hoja.js";

    window.__calcularConteos = async function (version, items) {
      const construirHoja = version === 1 ? construirHojaV1 : construirHojaV2;
      const paginas = await construirHoja(items);
      const primerIndiceItems = paginas.findIndex((p) => p.itemIds.length > 0);
      const paginasDemografia = primerIndiceItems === -1 ? paginas : paginas.slice(0, primerIndiceItems);
      const paginasItems = primerIndiceItems === -1 ? [] : paginas.slice(primerIndiceItems);
      return {
        demografia: paginasDemografia.map((p) => p.bloques),
        items: paginasItems.map((p) => p.bloques),
      };
    };

    window.__harnessListo = true;
  </script>
</html>
