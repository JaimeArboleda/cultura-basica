name = "cultura-basica"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[vars]
# Origen exacto (scheme+host, sin barra final) desde el que Cloudflare Pages sirve
# public/. Solo hace falta si Pages y el Worker NO están bajo el mismo dominio via
# una route /api/*; en ese caso same-origin no necesita CORS. Ajustar tras desplegar.
# También se usa como destino final del login de admin (§4.5): tras el OAuth de
# Google, el Worker redirige aquí con el token de sesión en el fragmento de la
# URL (`/admin/#token=…`). La redirect_uri que se registra en Google Cloud
# Console es otra: el dominio real del Worker (§4.6), no este.
ALLOWED_ORIGIN = "https://cultura-basica.pages.dev"

# Client ID de las credenciales OAuth de Google del panel de admin (§4.6). No es
# secreto (va siempre en la petición de autorización, visible en el navegador).
GOOGLE_CLIENT_ID = "240118355292-44gbi8798rq1ptlve0g94oi3i7232pt2.apps.googleusercontent.com"

# Modelo por defecto del motor de OCR-IA (§4.7): se puede cambiar aquí sin
# tocar código (el panel también puede pedir un modelo concreto por request,
# que gana sobre este valor). No es secreto.
OPENAI_MODEL = "gpt-5-mini"

[[d1_databases]]
binding = "DB"
database_name = "cultura-basica"
database_id = "7df34f15-cc38-4268-af72-8e5d9930a93b"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "81f103c6a7e344b0bce4b449bdafb5c2"

# EXPORT_TOKEN, GOOGLE_CLIENT_SECRET, ADMIN_SESSION_SECRET y OPENAI_API_KEY se
# definen como secret, no aquí (§4.6/§4.7):
#   wrangler secret put EXPORT_TOKEN
#   wrangler secret put GOOGLE_CLIENT_SECRET
#   wrangler secret put ADMIN_SESSION_SECRET   # cadena aleatoria larga cualquiera,
#                                               # p. ej. `openssl rand -base64 32`
#   wrangler secret put OPENAI_API_KEY         # API key de OpenAI para el motor de
#                                               # OCR-IA (§4.7) — REQUERIDA para poder
#                                               # digitalizar hojas en papel: es el
#                                               # único motor de lectura, sin
#                                               # alternativa local.
